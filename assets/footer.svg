<svg width="1200" height="100" viewBox="0 0 1200 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1200" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F4445"/>
      <stop offset="0.5" stop-color="#0C3639"/>
      <stop offset="1" stop-color="#0A272C"/>
    </linearGradient>
    <radialGradient id="fo" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#5EEAD4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="fblur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="fclip"><rect width="1200" height="100" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#fclip)">
    <rect width="1200" height="100" fill="url(#fbg)"/>
    <g filter="url(#fblur)">
      <circle cx="180" cy="110" r="150" fill="url(#fo)">
        <animate attributeName="cx" values="180;260;180" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="-10" r="150" fill="url(#fo)">
        <animate attributeName="cx" values="1040;960;1040" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="600" y="48" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="17" fill="#C9E8E1">Code for healthier lives<tspan fill="#5EEAD4">.</tspan></text>
    <text x="600" y="73" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" letter-spacing="4" fill="#6FA89E">HANGZHOU · CHINA</text>
  </g>
</svg>
